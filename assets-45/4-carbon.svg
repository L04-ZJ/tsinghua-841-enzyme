<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-label="图4-B｜与碳转移有关，不代表转移相同对象"><title>图4-B｜与碳转移有关，不代表转移相同对象</title><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2d688d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#193d61"><text x="30" y="42" font-size="25" font-weight="700">图4-B｜与碳转移有关，不代表转移相同对象</text><text x="30" y="85" font-size="17" fill="#536b7a">生物素：固定无机碳，ATP帮助活化</text><rect x="30.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="130.25" y="127" text-anchor="middle" font-size="17">HCO₃⁻ + ATP</text><path d="M233.5 133 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="362.75" y="127" text-anchor="middle" font-size="17">羧基暂接脲基氮</text><path d="M466.0 133 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="595.25" y="127" text-anchor="middle" font-size="17">摆臂移动至受体</text><path d="M698.5 133 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="827.75" y="127" text-anchor="middle" font-size="17">丙酮酸 → 草酰乙酸</text><text x="30" y="205" font-size="17" fill="#536b7a">THF：N5/N10携带不同氧化态的一碳单位</text><rect x="30.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="130.25" y="247" text-anchor="middle" font-size="17">丝氨酸等供碳</text><path d="M233.5 253 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="362.75" y="247" text-anchor="middle" font-size="17">5,10-亚甲基THF</text><path d="M466.0 253 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="595.25" y="247" text-anchor="middle" font-size="17">dUMP → dTMP</text><path d="M698.5 253 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="827.75" y="247" text-anchor="middle" font-size="17">DHF → THF 再生</text><text x="30" y="325" font-size="17" fill="#536b7a">B₁₂：甲基转移和自由基重排是两类用途</text><rect x="30.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="130.25" y="367" text-anchor="middle" font-size="17">5-甲基THF供甲基</text><path d="M233.5 373 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="362.75" y="367" text-anchor="middle" font-size="17">甲基钴胺素中转</text><path d="M466.0 373 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="595.25" y="367" text-anchor="middle" font-size="17">同型半胱氨酸</text><path d="M698.5 373 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="827.75" y="367" text-anchor="middle" font-size="17">甲硫氨酸 + THF</text><text x="30" y="510" font-size="16">另一用途：腺苷钴胺素支持甲基丙二酰CoA → 琥珀酰CoA的自由基重排。</text></g></svg>