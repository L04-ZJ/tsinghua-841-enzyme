<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-label="图4-A｜丙酮酸氧化脱羧：碳流与电子流"><title>图4-A｜丙酮酸氧化脱羧：碳流与电子流</title><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2d688d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#193d61"><text x="30" y="42" font-size="25" font-weight="700">图4-A｜丙酮酸氧化脱羧：碳流与电子流</text><text x="30" y="85" font-size="17" fill="#536b7a">碳流：先脱羧，再转移乙酰基</text><rect x="30.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="130.25" y="127" text-anchor="middle" font-size="17">丙酮酸 3C</text><text x="130.25" y="150" text-anchor="middle" font-size="17">C1 → CO₂</text><path d="M233.5 133 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="362.75" y="127" text-anchor="middle" font-size="17">羟乙基—TPP</text><text x="362.75" y="150" text-anchor="middle" font-size="17">E1，2C保留</text><path d="M466.0 133 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="595.25" y="127" text-anchor="middle" font-size="17">乙酰—硫辛酰胺</text><text x="595.25" y="150" text-anchor="middle" font-size="17">E2，形成硫酯</text><path d="M698.5 133 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="827.75" y="127" text-anchor="middle" font-size="17">乙酰—S—CoA</text><text x="827.75" y="150" text-anchor="middle" font-size="17">2C产物离开</text><text x="30" y="205" font-size="17" fill="#536b7a">电子流：让催化组分回到起始状态</text><rect x="30.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="130.25" y="247" text-anchor="middle" font-size="17">底物羟乙基</text><text x="130.25" y="270" text-anchor="middle" font-size="17">氧化为乙酰基</text><path d="M233.5 253 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="362.75" y="247" text-anchor="middle" font-size="17">硫辛酰胺</text><text x="362.75" y="270" text-anchor="middle" font-size="17">S—S → 2SH</text><path d="M466.0 253 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="595.25" y="247" text-anchor="middle" font-size="17">FAD ⇌ FADH₂</text><text x="595.25" y="270" text-anchor="middle" font-size="17">E3紧密结合</text><path d="M698.5 253 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="827.75" y="247" text-anchor="middle" font-size="17">NAD⁺ → NADH</text><text x="827.75" y="270" text-anchor="middle" font-size="17">最终接受2e⁻</text><text x="30" y="325" font-size="17" fill="#536b7a">分工不是简单并列</text><rect x="30.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="130.25" y="367" text-anchor="middle" font-size="17">TPP：稳定碳中间体</text><path d="M233.5 373 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="362.75" y="367" text-anchor="middle" font-size="17">硫辛酰胺：摆臂</text><path d="M466.0 373 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="595.25" y="367" text-anchor="middle" font-size="17">CoA：酰基共底物</text><path d="M698.5 373 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="827.75" y="367" text-anchor="middle" font-size="17">FAD/NAD：再氧化</text><text x="30" y="510" font-size="16">总式：丙酮酸 + CoA-SH + NAD⁺ → 乙酰CoA + CO₂ + NADH + H⁺</text></g></svg>