<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" role="img" aria-label="图4-D PLP转氨循环：内外醛亚胺及两个半反应"><title>图4-D PLP转氨循环</title><desc>酶赖氨酸与PLP为内醛亚胺；底物进入形成外醛亚胺，经重排水解得到酮酸和PMP；第二个酮酸接受氨基后再生PLP。图为机制流程，不是完整化学结构式。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="#2d688d"/></marker></defs><rect width="1000" height="575" rx="16" fill="#f8fbff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#193d61"><text x="30" y="44" font-size="25" font-weight="700">图4-D｜PLP转氨：暂存氨基，再交给另一碳骨架</text><text x="30" y="85" font-size="17">第一半反应：氨基酸₁ → α-酮酸₁，PLP → PMP</text><g fill="#e3f2ef" stroke="#a9c2d7"><rect x="30" y="110" width="280" height="100" rx="10"/><rect x="360" y="110" width="280" height="100" rx="10"/><rect x="690" y="110" width="280" height="100" rx="10"/></g><text x="170" y="146" text-anchor="middle" font-size="19">酶-Lys—PLP</text><text x="170" y="180" text-anchor="middle" font-size="17">内醛亚胺</text><text x="500" y="146" text-anchor="middle" font-size="19">底物氨基酸—PLP</text><text x="500" y="180" text-anchor="middle" font-size="17">外醛亚胺；稳定中间体</text><text x="830" y="146" text-anchor="middle" font-size="19">酶-PMP ＋ α-酮酸₁</text><text x="830" y="180" text-anchor="middle" font-size="17">氨基暂存于辅酶</text><g fill="none" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"><path d="M314 160H354"/><path d="M644 160H684"/></g><text x="30" y="265" font-size="17">第二半反应：α-酮酸₂ → 氨基酸₂，PMP → PLP</text><g fill="#e9effc" stroke="#a9c2d7"><rect x="30" y="290" width="280" height="100" rx="10"/><rect x="360" y="290" width="280" height="100" rx="10"/><rect x="690" y="290" width="280" height="100" rx="10"/></g><text x="170" y="326" text-anchor="middle" font-size="19">酶-PMP ＋ α-酮酸₂</text><text x="170" y="360" text-anchor="middle" font-size="17">另一个碳骨架进入</text><text x="500" y="326" text-anchor="middle" font-size="19">氨基转移与逆向重排</text><text x="500" y="360" text-anchor="middle" font-size="17">形成新的氨基酸产物</text><text x="830" y="326" text-anchor="middle" font-size="19">氨基酸₂ ＋ 酶-Lys—PLP</text><text x="830" y="360" text-anchor="middle" font-size="17">内醛亚胺状态再生</text><g fill="none" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"><path d="M314 340H354"/><path d="M644 340H684"/></g><text x="30" y="448" font-size="18" font-weight="700">总反应：氨基酸₁ ＋ α-酮酸₂ ⇌ α-酮酸₁ ＋ 氨基酸₂</text><text x="30" y="490" font-size="17">通常不净释放游离氨；PLP/PMP在循环中再生。</text><text x="30" y="535" font-size="16">连接关系与半反应示意；完整结构和电子变化参见教材p83—85及本章4.6。</text></g></svg>