<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-label="图4-C｜维生素D：从前体到活性激素"><title>图4-C｜维生素D：从前体到活性激素</title><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2d688d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#193d61"><text x="30" y="42" font-size="25" font-weight="700">图4-C｜维生素D：从前体到活性激素</text><text x="30" y="85" font-size="17" fill="#536b7a">来源与活化</text><rect x="30.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="130.25" y="127" text-anchor="middle" font-size="17">皮肤7-脱氢胆固醇</text><text x="130.25" y="150" text-anchor="middle" font-size="17">UVB → D₃</text><path d="M233.5 133 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="362.75" y="127" text-anchor="middle" font-size="17">肝：25-羟化</text><text x="362.75" y="150" text-anchor="middle" font-size="17">25-羟D</text><path d="M466.0 133 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="595.25" y="127" text-anchor="middle" font-size="17">肾：1α-羟化</text><text x="595.25" y="150" text-anchor="middle" font-size="17">1,25-二羟D</text><path d="M698.5 133 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="100" width="200.5" height="65" rx="10" fill="#e3f2ef" stroke="#a9c2d7"/><text x="827.75" y="127" text-anchor="middle" font-size="17">受体调节表达</text><text x="827.75" y="150" text-anchor="middle" font-size="17">肠、骨等靶组织</text><text x="30" y="205" font-size="17" fill="#536b7a">肾功能受损：前体充足也不保证活性形式充足</text><rect x="30.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="130.25" y="247" text-anchor="middle" font-size="17">1α-羟化能力下降</text><path d="M233.5 253 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="362.75" y="247" text-anchor="middle" font-size="17">骨化三醇不足</text><path d="M466.0 253 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="595.25" y="247" text-anchor="middle" font-size="17">肠钙吸收受影响</text><path d="M698.5 253 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="827.75" y="247" text-anchor="middle" font-size="17">矿化与骨转换异常</text><text x="30" y="325" font-size="17" fill="#536b7a">钙磷系统：必须结合器官与条件</text><rect x="30.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="130.25" y="367" text-anchor="middle" font-size="17">肾排磷能力下降</text><path d="M233.5 373 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="362.75" y="367" text-anchor="middle" font-size="17">磷潴留等改变</text><path d="M466.0 373 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="595.25" y="367" text-anchor="middle" font-size="17">PTH/FGF23调节</text><path d="M698.5 373 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="827.75" y="367" text-anchor="middle" font-size="17">并非一律矿物质流失</text><text x="30" y="510" font-size="16">儿童典型为佝偻病；成人矿化缺陷为骨软化，不能与骨质疏松完全混称。</text></g></svg>