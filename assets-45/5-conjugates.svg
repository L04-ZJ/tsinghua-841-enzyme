<rect x="495.0" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="595.25" y="247" text-anchor="middle" font-size="17">单体 + 连接蛋白</text><path d="M698.5 253 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="220" width="200.5" height="65" rx="10" fill="#e9effc" stroke="#a9c2d7"/><text x="827.75" y="247" text-anchor="middle" font-size="17">非共价结合HA</text><text x="30" y="325" font-size="17" fill="#536b7a">肽聚糖：糖链与交联肽分开</text><rect x="30.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="130.25" y="367" text-anchor="middle" font-size="17">GlcNAc/MurNAc</text><path d="M233.5 373 H257.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="262.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="362.75" y="367" text-anchor="middle" font-size="17">β(1→4)糖链</text><path d="M466.0 373 H490.0" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="495.0" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="595.25" y="367" text-anchor="middle" font-size="17">MurNAc乳酰基接肽</text><path d="M698.5 373 H722.5" stroke="#2d688d" stroke-width="2" marker-end="url(#arrow)"/><rect x="727.5" y="340" width="200.5" height="65" rx="10" fill="#fff0dd" stroke="#a9c2d7"/><text x="827.75" y="367" text-anchor="middle" font-size="17">肽间交联成网络</text><text x="30" y="510" font-size="16">N/O第一行左两格为一组、右两格为一组；HA不硫酸化，不共价接核心蛋白。</text></g></svg>